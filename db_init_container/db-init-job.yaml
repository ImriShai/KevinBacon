apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: db_init:latest
          imagePullPolicy: Never
          env:
            - name: NEO4J_AUTH
              value: neo4j/ForgetMeN0t