apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: db-writer
  name: db-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: db-writer
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: db-writer
    spec:
      containers:
        - env:
            - name: NEO4J_AUTH
              value: neo4j/ForgetMeN0t
          image: db_writer
          imagePullPolicy: Never
          name: db-writer
      restartPolicy: Always

