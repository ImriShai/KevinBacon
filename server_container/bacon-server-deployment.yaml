apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: bacon-server
  name: bacon-server
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: bacon-server
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: bacon-server
    spec:
      containers:
        - env:
            - name: NEO4J_AUTH
              value: neo4j/ForgetMeN0t
          image: bacon_server
          imagePullPolicy: Never
          name: bacon-server
          ports:
            - containerPort: 5000
              protocol: TCP
      restartPolicy: Always
