apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: service-neo4j
  name: neo4j
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: service-neo4j
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: service-neo4j
    spec:
      containers:
        - env:
            - name: NEO4J_AUTH
              value: neo4j/ForgetMeN0t
          image: neo4j:latest
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          name: neo4j
          ports:
            - containerPort: 7687
              protocol: TCP
          volumeMounts:
            - mountPath: /logs
              name: neo4j-claim0
            - mountPath: /config
              name: neo4j-claim1
            - mountPath: /data
              name: neo4j-claim2
            - mountPath: /plugins
              name: neo4j-claim3
      restartPolicy: Always
      volumes:
        - name: neo4j-claim0
          persistentVolumeClaim:
            claimName: neo4j-claim0
        - name: neo4j-claim1
          persistentVolumeClaim:
            claimName: neo4j-claim1
        - name: neo4j-claim2
          persistentVolumeClaim:
            claimName: neo4j-claim2
        - name: neo4j-claim3
          persistentVolumeClaim:
            claimName: neo4j-claim3
